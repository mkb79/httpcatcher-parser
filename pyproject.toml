[project]
name = "httpcatcher-parser"
version = "0.2.0"
description = "Parser and HAR exporter for HTTP Catcher session files with optional MCP server."
authors = [{ name = "mkb79", email = "mkb79@hackitall.de" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "AGPL-3.0-only"
keywords = [
    "HTTP Catcher",
    "HAR",
    "binary parser",
    "network analysis",
    "reverse engineering",
    "MCP",
    "Model Context Protocol"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "brotli>=1.1.0",
]

[project.optional-dependencies]
# MCP Server Feature
mcp = [
    "mcp>=0.9.0",
    "aiosqlite>=0.19.0",    # Async SQLite
    "aiofiles>=23.0.0",     # Async file operations
    "tqdm>=4.66.0",         # Progress bars
]

# Development Dependencies
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

# All extras
all = [
    "httpcatcher-parser[mcp,dev]",
]

[project.scripts]
hc-parser = "httpcatcher_parser.hc_parser:main"
hc-har = "httpcatcher_parser.hc_har:main"
hc-mcp = "httpcatcher_parser.mcp.cli:main"

[tool.hatch.build.targets.sdist]
include = ["src/httpcatcher_parser"]

[tool.hatch.build.targets.wheel]
include = ["src/httpcatcher_parser"]

[tool.hatch.build.targets.wheel.sources]
"src/httpcatcher_parser" = "httpcatcher_parser"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.7.1"
